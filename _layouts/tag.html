---
layout: default
---
<div class="layout">
  <aside class="aside">
    <div class="section" style="border-top: 0; padding-top: 0; padding-bottom: 0;">
      <h2 class="label">Tag</h2>
      <div class="bio">
        <p>Posts tagged with <span class="tag">{{ page.tag }}</span>.</p>
        <p><a href="{{ '/writing/' | relative_url }}" class="link-muted">All writing <span class="arrow">→</span></a></p>
      </div>
    </div>
  </aside>

  <div class="content">
    <section class="section" style="border-top: 0; padding-top: 0;">
      <div class="section-head">
        <h2 class="label">Tagged "{{ page.tag }}"<span class="count">{{ site.tags[page.tag].size }}</span></h2>
      </div>
      <div class="post-list">
        {% for post in site.tags[page.tag] %}
          {% include post-row.html post=post %}
        {% endfor %}
      </div>
    </section>
  </div>
</div>
